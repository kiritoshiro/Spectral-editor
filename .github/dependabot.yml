version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
  groups:
    github_actions:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  groups:
    cargo:
      patterns: ['*']
      update-types: [minor, patch]
