name: Desktop builds and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test speech leveling and WAV roundtrip
        run: cargo test --release --locked
      - name: Build standalone application
        run: cargo build --release --locked
      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, package | Out-Null
          Copy-Item target/release/speech-fixer.exe package/Speech-Fixer.exe
          Copy-Item README.md, CREDITS.md -Destination package
          Compress-Archive -Path package/* -DestinationPath dist/Spectral-editor-windows-x86_64.zip
          (Get-FileHash dist/Spectral-editor-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + '  Spectral-editor-windows-x86_64.zip' | Set-Content dist/Spectral-editor-windows-x86_64.zip.sha256
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
          OUTPUT: ${{ github.workspace }}/dist/Spectral-editor-linux-x86_64.AppImage
        run: |
          mkdir -p dist AppDir/usr/share/doc/spectral-editor
          cp README.md CREDITS.md AppDir/usr/share/doc/spectral-editor/
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/linuxdeploy.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
          "$RUNNER_TEMP/linuxdeploy.AppImage" --appdir AppDir \
            --executable target/release/speech-fixer \
            --desktop-file packaging/linux/spectral-editor.desktop \
            --icon-file packaging/linux/spectral-editor.svg \
            --library /usr/lib/x86_64-linux-gnu/libasound.so.2 \
            --output appimage
          "$OUTPUT" --appimage-extract-and-run --help
          cd dist
          sha256sum Spectral-editor-linux-x86_64.AppImage > Spectral-editor-linux-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Spectral-editor-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish both platforms and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Spectral Editor $RELEASE_TAG" --generate-notes
